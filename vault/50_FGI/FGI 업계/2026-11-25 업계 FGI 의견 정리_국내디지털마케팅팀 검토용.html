<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대한민국 구석구석 업계 FGI 의견</title>
<style>
/* html-guide kit v1 — 단일 HTML 안내자료 공통 스타일 (2026-11-05)
   색은 대한민국 구석구석 BI 지정색(guidelines/brand-identity.md). 필요한 것만 골라 써도 된다.
   부품 목록·사용법: _system/scripts/html-guide/kit/README.md, 미리보기: kit/gallery.html */
:root{
  --k-black:#000000; --k-sky:#236cf6; --k-sun:#e65019; --k-exp:#a56fd4; --k-nature:#0faa3c;
  --k-gold:#a38158; --k-silver:#8a8d8e;
  --k-ink:#1b1d22; --k-sub:#5b616e; --k-line:#e3e6ec; --k-bg:#f6f7f9; --k-card:#ffffff;
  --k-accent:var(--k-sky); --k-warn:var(--k-sun);
  --k-radius:14px; --k-shadow:0 6px 24px rgba(20,30,60,.08);
  --k-font:"Pretendard","Pretendard Variable","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
}
*{box-sizing:border-box}
body.k-app{margin:0;font-family:var(--k-font);color:var(--k-ink);background:var(--k-bg);line-height:1.55;word-break:keep-all}
.k-wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px}
.k-h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
.k-h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 12px}
.k-lead{color:var(--k-sub);font-size:16px;margin:0 0 20px}
.k-src{color:var(--k-silver);font-size:12px;margin-top:10px}
.k-tag{display:inline-block;padding:2px 10px;border-radius:99px;background:#eef3ff;color:var(--k-sky);font-size:12px;font-weight:700}
.k-tag.sun{background:#fff1ec;color:var(--k-sun)} .k-tag.nature{background:#ebf8ef;color:var(--k-nature)} .k-tag.exp{background:#f5effb;color:var(--k-exp)}
.k-blank{font-weight:800;color:var(--k-sun)}

/* 버튼·카드·격자 */
.k-btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;font:700 14px var(--k-font);background:var(--k-sky);color:#fff;cursor:pointer}
.k-btn.ghost{background:#fff;color:var(--k-ink);border:1px solid var(--k-line)}
.k-btn:focus-visible{outline:3px solid #9cc0ff;outline-offset:2px}
.k-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(var(--k-col,260px),1fr))}
.k-card{background:var(--k-card);border:1px solid var(--k-line);border-radius:var(--k-radius);padding:18px;box-shadow:var(--k-shadow)}
.k-card h4{margin:0 0 6px;font-size:17px}
.k-card .k-card-sub{color:var(--k-sub);font-size:14px}

/* 단계 화면 (K.steps) */
.k-nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:10px 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--k-line)}
.k-nav button{border:0;background:none;padding:8px 14px;border-radius:99px;font:700 14px var(--k-font);color:var(--k-sub);cursor:pointer}
.k-nav button.on{background:var(--k-ink);color:#fff}
.k-nav .k-nav-num{opacity:.6;margin-right:4px}
.k-step{display:none;animation:k-fade .35s ease}
.k-step.on{display:block}
@keyframes k-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 탭 (K.tabs) */
.k-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.k-tabs [data-tab]{border:1px solid var(--k-line);background:#fff;border-radius:99px;padding:7px 14px;font:700 13px var(--k-font);cursor:pointer;color:var(--k-sub)}
.k-tabs [data-tab].on{border-color:var(--k-sky);color:var(--k-sky);background:#eef3ff}
[data-panel]{display:none} [data-panel].on{display:block}

/* 등장 (K.reveal) */
[data-reveal]{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
[data-reveal].is-in{opacity:1;transform:none}

/* 숫자 (K.countUp) */
.k-num{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--k-ink);font-variant-numeric:tabular-nums}
.k-num-unit{font-size:16px;color:var(--k-sub);margin-left:4px}

/* 시연 무대: 캡처 이미지 위에 포인터·강조 상자를 올린다 (K.stage) */
.k-stage{position:relative;overflow:hidden;border-radius:var(--k-radius);border:1px solid var(--k-line);background:#fff}
.k-stage > img{display:block;width:100%;height:auto}
.k-pointer{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-3px 0 0 -5px;z-index:6;pointer-events:none;
  transition:left .8s cubic-bezier(.4,0,.2,1),top .8s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.k-pointer svg{width:100%;height:100%}
.k-pointer.press{transform:scale(.85)}
.k-ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--k-sky);z-index:5;pointer-events:none;animation:k-ripple .7s ease-out forwards}
@keyframes k-ripple{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.k-spot{position:absolute;z-index:4;border:3px solid var(--k-sun);border-radius:10px;box-shadow:0 0 0 9999px rgba(10,14,25,.45);pointer-events:none;
  transition:left .6s ease,top .6s ease,width .6s ease,height .6s ease,opacity .3s}
.k-spot.pulse{animation:k-spot-pulse 1.2s ease-in-out infinite}
@keyframes k-spot-pulse{50%{border-color:#ffb08f}}
.k-spot-label{position:absolute;left:0;top:100%;margin-top:8px;white-space:nowrap;background:var(--k-sun);color:#fff;font:700 13px var(--k-font);padding:4px 10px;border-radius:8px}

/* 휴대폰 틀 + 화면 넘기기 (K.phone) */
.k-phone{position:relative;width:var(--k-phone-w,260px);aspect-ratio:9/19;border-radius:36px;background:#111;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.k-phone-screen{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:#fff}
.k-phone-screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .7s ease,transform .7s ease;transform:translateY(12px)}
.k-phone-screen img.on{opacity:1;transform:none}
.k-phone::before{content:"";position:absolute;top:16px;left:50%;width:70px;height:18px;margin-left:-35px;border-radius:12px;background:#111;z-index:2}

/* 흐름도 (K.flow) — 사례·절차 그림 */
.k-flow{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;overflow-x:auto;padding:4px 2px 10px}
.k-flow.v{flex-direction:column}
.k-flow-step{flex:1 1 0;min-width:130px;background:#fff;border:2px solid var(--k-line);border-radius:12px;padding:12px;transition:border-color .3s,transform .3s,box-shadow .3s}
.k-flow-step .k-flow-when{font-size:12px;font-weight:700;color:var(--k-sub)}
.k-flow-step .k-flow-icon{font-size:22px;line-height:1.2}
.k-flow-step .k-flow-title{font-weight:800;margin:4px 0 2px}
.k-flow-step .k-flow-desc{font-size:13px;color:var(--k-sub)}
.k-flow-step.on{border-color:var(--k-flow-c,var(--k-sky));transform:translateY(-3px);box-shadow:var(--k-shadow)}
.k-flow-arrow{flex:0 0 28px;display:flex;align-items:center;justify-content:center;color:var(--k-silver);font-size:20px}
.k-flow.v .k-flow-arrow{flex-basis:22px;transform:rotate(90deg)}
.k-flow-arrow.on{color:var(--k-flow-c,var(--k-sky))}

/* 막대 (K.bars) */
.k-bars{display:grid;gap:10px}
.k-bar-row{display:grid;grid-template-columns:var(--k-bar-label,140px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.k-bar-track{height:14px;border-radius:99px;background:#edf0f5;overflow:hidden}
.k-bar-fill{height:100%;width:0;border-radius:99px;background:var(--k-sky);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.k-bar-val{font-weight:800;font-variant-numeric:tabular-nums}

/* 모달·알림 (K.modal, K.toast) */
.k-modal-bg{position:fixed;inset:0;z-index:50;background:rgba(10,14,25,.5);display:flex;align-items:center;justify-content:center;padding:24px}
.k-modal{position:relative;max-width:720px;width:100%;max-height:85vh;overflow:auto;background:#fff;border-radius:16px;padding:24px}
.k-modal-x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:24px;cursor:pointer;color:var(--k-sub)}
.k-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;background:var(--k-ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;animation:k-fade .25s ease}

/* 자료 검수 결과 (K.checkImage, K.checkText) */
.k-check{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.k-check li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.k-check li::before{content:"✓";font-weight:800;color:var(--k-nature)}
.k-check li.ng::before{content:"✕";color:var(--k-sun)}
.k-check li.ask::before{content:"?";color:var(--k-exp)}
.k-drop{border:2px dashed var(--k-line);border-radius:12px;padding:22px;text-align:center;color:var(--k-sub);cursor:pointer}
.k-drop.over{border-color:var(--k-sky);background:#eef3ff}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.k-nav{display:none}.k-step{display:block!important;page-break-after:always}}

</style>
<style>
/* 회색 계열 하나 + 강조색 하늘(BI) 하나. 형광펜은 인용구에만 */
:root{
  --bg:#f6f6f4; --surface:#ffffff; --ink:#1d1f23; --sub:#555a63; --muted:#8a8f98;
  --line:rgba(29,31,35,.09); --line2:rgba(29,31,35,.16);
  --accent:#236cf6; --accent-ink:#1a56c8; --req:#b8410f;
  --hl:#fbeea3;
  --mono:"JetBrains Mono","D2Coding",Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
body.k-app{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}

header.top{background:var(--k-sky);color:#fff;padding:44px 0 32px}
header.top h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.02em}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.legend div{background:#fff;color:var(--sub);border-radius:12px;padding:16px 20px;font-size:14px;line-height:1.6;display:grid;grid-template-columns:40px 1fr;column-gap:12px;align-items:start}
.legend .gb{width:40px;height:40px;border-radius:10px;font-size:18px;grid-row:span 2}
.legend b{font-weight:600;color:var(--ink);font-size:15px}
.gb{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;color:#fff;font:600 13px var(--k-font)}
.gb.gA{background:var(--k-sky)} .gb.gB{background:var(--k-nature)} .gb.gC{background:var(--k-exp)}
header.top p.sub{margin:10px 0 0;font-size:14px;opacity:.9}

nav.secs{position:sticky;top:0;z-index:30;background:rgba(246,246,244,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2)}
nav.secs .wrap{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:12px;padding-bottom:12px}
nav.secs button{flex:none;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 14px;font:500 14px var(--k-font);color:var(--ink);cursor:pointer;transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
nav.secs button small{font:400 12px var(--mono);color:var(--muted);margin-left:6px}
nav.secs button:hover{border-color:var(--k-sky);color:var(--accent-ink)}
nav.secs button.on{background:var(--k-sky);border-color:var(--k-sky);color:#fff}
nav.secs button.on small{color:rgba(255,255,255,.8)}
nav.secs .sep{flex:none;width:1px;background:var(--line2);margin:4px 4px}
nav.secs button.reqtab{color:var(--req);border-color:rgba(184,65,15,.35)}
nav.secs button.reqtab:hover{border-color:var(--req);color:var(--req)}
nav.secs button.reqtab.on{background:var(--req);border-color:var(--req);color:#fff}

.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:20px 0 4px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;font:500 13px var(--k-font);color:var(--sub);cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:#fff}
.tools select,.tools input[type=search]{font:400 14px var(--k-font);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;height:32px;background:var(--surface);color:var(--ink)}
.tools input[type=search]{flex:1;min-width:200px}
.tools select:focus,.tools input:focus,.seg button:focus-visible,nav.secs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools label{font-size:14px;color:var(--sub);display:flex;gap:6px;align-items:center;cursor:pointer}
.count{font:400 12px var(--mono);color:var(--muted);margin-left:auto}

.head{display:flex;align-items:baseline;gap:12px;margin:32px 0 16px}
.head h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.head span{font:400 13px var(--mono);color:var(--muted)}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:8px}
.summary h3{margin:0 0 12px;font-size:13px;font-weight:500;color:var(--muted)}
.summary ol{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.summary li{display:grid;grid-template-columns:24px 1fr;font-size:15px;color:var(--sub);counter-increment:s}
.summary li::before{content:counter(s);font:500 13px var(--mono);color:var(--accent);padding-top:2px}
.summary li .sh{font-size:16px;font-weight:500;color:var(--ink)}
.summary li .tip{left:-8px}

.subnav{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 0}
.subnav a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;transition:border-color .15s var(--ease),color .15s var(--ease)}
.subnav a:hover{border-color:var(--k-sky);color:var(--accent-ink)}
.subnav a small{font:400 12px var(--mono);color:var(--muted)}
h3.sub{margin:40px 0 0;font-size:16px;font-weight:600;display:flex;align-items:baseline;gap:10px;scroll-margin-top:72px}
h3.sub span{font:400 12px var(--mono);color:var(--muted)}

/* 표: 그룹 | 발언자 | 주요내용 | 비고 | 위치 */
.tbl{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tbl>:first-child{border-radius:12px 12px 0 0}
.tr{display:grid;grid-template-columns:40px 168px minmax(0,1fr) 208px 72px;column-gap:16px;padding:14px 20px;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}
.tr.th{padding:10px 20px;font-size:12px;color:var(--muted);background:#fafaf8}
.tr.cont{border-top-color:transparent;padding-top:0}
.g{padding-top:0}
.org{font-weight:600;font-size:15px;line-height:1.45;padding-top:2px}
.txt{color:var(--ink);position:relative}
.sh{cursor:help;font-size:15.5px;border-bottom:1px dashed rgba(29,31,35,.25);outline:0}
.sh:focus-visible{box-shadow:0 0 0 2px var(--accent);border-radius:2px}
.tip{position:absolute;left:-12px;top:calc(100% + 8px);z-index:40;width:min(560px,calc(100vw - 48px));background:var(--ink);color:#f3f4f6;font-size:14px;line-height:1.65;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s var(--ease),transform .15s var(--ease),visibility .15s}
.tip q.hl{background:none;color:#fbe27a;padding:0}
.txt:hover .tip,.sh:focus + .tip,.txt.open .tip{opacity:1;visibility:visible;transform:none}
.tr:last-child .txt .tip{top:auto;bottom:calc(100% + 8px)}
.ow{position:relative;display:inline}
.on{cursor:help;border-bottom:1px dashed rgba(29,31,35,.35);outline:0}
.on:focus-visible{box-shadow:0 0 0 2px var(--accent);border-radius:2px}
.tip-s{left:0;width:max-content;max-width:300px;font-size:13.5px;font-weight:400;padding:8px 12px}
.ow:hover>.tip,.on:focus+.tip,.ow.open>.tip{opacity:1;visibility:visible;transform:none}
.note{font-size:13px;line-height:1.5;color:var(--muted);display:grid;gap:4px;align-content:start;padding-top:2px}
.note a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(35,108,246,.4);cursor:pointer}
.note a:hover{text-decoration-color:var(--accent-ink)}
.note .rq{color:var(--req)}
.note em{font-style:normal;color:var(--sub)}
.tc{font:400 12px var(--mono);color:var(--muted);text-align:right;padding-top:3px;white-space:nowrap}
q.hl{quotes:none;background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 1px;color:var(--ink)}
mark{background:none;color:inherit;box-shadow:inset 0 -2px 0 var(--accent)}
.empty{padding:48px;text-align:center;color:var(--muted)}

/* 건의사항 */
.rtr{display:grid;grid-template-columns:40px 168px minmax(0,1fr) 72px;column-gap:16px;padding:12px 20px;border-top:1px solid var(--line)}
.rtr:first-child{border-top:0}
.rtr .ask{font-weight:500}
.rtr details{margin-top:2px}
.rtr summary{font-size:13px;color:var(--muted);cursor:pointer;list-style:none}
.rtr summary::before{content:"+ ";font-family:var(--mono)}
.rtr details[open] summary::before{content:"− "}
.rtr details p{margin:6px 0 0;font-size:14px;color:var(--sub)}

footer{height:80px}
nav.secs button.tasktab{color:var(--ink);border-color:var(--ink)}
nav.secs button.tasktab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.st2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:8px}
.st2 .summary{margin-bottom:0}
.tcard,.sbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 24px}
.tcard h3,.sbox h3{margin:0 0 12px;font-size:13px;font-weight:500;color:var(--muted)}
.tcard h4{margin:14px 0 6px;font-size:13px;font-weight:600;color:var(--accent-ink)}
.tcard h4:first-of-type{margin-top:0}.tcard h4.lg{color:var(--req)}
.tcard ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
.tcard li small{display:block;font-size:12.5px;color:var(--muted)}
.tcard .no{font:500 12px var(--mono);color:var(--accent-ink);margin-left:6px}
.tcard .more{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent-ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.intro{font-size:16px;color:var(--sub);margin:0 0 16px;max-width:860px}
.sg{display:grid;grid-template-columns:176px 1fr 1fr 1fr 150px;column-gap:18px;padding:16px 20px;border-top:1px solid var(--line);font-size:14.5px}
.sg:first-child{border-top:0}.sg.th{padding:10px 20px;font-size:12px;color:var(--muted);background:#fafaf8;border-radius:12px 12px 0 0}
.sg .nm{font-weight:600;font-size:15px}.sg .ow2{font-size:13px;color:var(--sub)}
.sg ul{margin:0;padding-left:16px;display:grid;gap:4px}
.s3{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.sbox ol,.sbox ul{margin:0;padding-left:20px;display:grid;gap:10px}
.sbox li b{font-weight:600}.sbox li span{display:block;font-size:14px;color:var(--sub)}
.sbox li em{font-style:normal;font-size:12px;color:var(--muted);margin-right:6px}

  return `<div class="head"><h2>${TASK}</h2><span>6개 개선 과제 · 수행사 제안</span></div><p class="intro">${esc(S.intro)}</p>
    <div class="tbl"><div class="sg th"><div>개선 과제</div><div>단기 (현행 운영 개선)</div><div>중장기 ① 2027년 사업 검토</div><div>중장기 ② 플랫폼 개편 연계</div><div>협의 부서(안)</div></div>${rows}</div>
    <div class="s3"><div class="sbox"><h3>추진 우선순위(안)</h3><ol>${S.pri.map(x => `<li><em>${esc(x[0])}</em><b>${esc(x[1])}</b><span>${esc(x[2])}</span></li>`).join('')}</ol></div>
    <div class="sbox"><h3>참여자 의견이 엇갈린 사안</h3><ol>${S.choices.map(x => `<li><b>${esc(x[0])}</b>${x[1].split('\n').map(l => `<span>${esc(l)}</span>`).join('')}</li>`).join('')}</ol></div></div>
    <div class="s3"><div class="sbox"><h3>추가 분석사항</h3><ul>${S.base.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><div></div></div>
    <ul class="tnotes">${S.notes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
}

const GROUPS = {'A':[],'B':[],'C':[]};
ROWS.forEach(r => { if (!GROUPS[r.group].includes(r.org)) GROUPS[r.group].push(r.org); });
const ORGS = Object.values(GROUPS).flat();
const st = {sec: SECS[0], g: '', org: '', q: '', onlyReq: false};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tsec = t => { if (!/^\d/.test(String(t))) return 999999; const p = String(t).split(':').map(Number); return p.length === 3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1]; };
const byOrg = (a, b) => a.group.localeCompare(b.group) || ORGS.indexOf(a.org) - ORGS.indexOf(b.org) || tsec(a.time) - tsec(b.time);
const tc = t => { const p = String(t).split(':'); return p.length === 3 ? `${+p[0]}:${p[1]}:${p[2]}` : t; };

function hl(s){
  let h = esc(s);
  if (!st.q) return h;
  const q = esc(st.q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return h.replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
}
// 발언 속 "인용구"에 형광펜
function body(s){
  return hl(s).replace(/(?:&quot;|“)(.+?)(?:&quot;|”)/g, (m, x) => `<q class="hl">${x}</q>`);
}

const GNAME = {'A':'기존 민간 협력사', 'B':'기존 공공 협력기관', 'C':'미협업 민간기업'};
// 참석자 소개(전사본·사전 설문 기준)
const ORG_INFO = {"승우여행사 서OO 이사": "트레킹 전문 여행사. 지역관광 부스터 참여, 등록 상품 4건", "홍익여행사 양OO 부사장": "기차여행 전문, 홀세일·직판. 지역관광 부스터 참여, 등록 상품 62건", "원더윅스컴퍼니 맘맘 서OO 이사": "아이 동반 여행 플랫폼. 지역관광 부스터 홍보형 참여", "현대백화점 H.Point 고OO 책임": "통합 멤버십. 공사와는 기협업, 대구석과는 직접 협업 없음", "소노캄 서OO 매니저": "호텔·리조트. 대구석 DB 등록(2026. 4.), 세션 C 참석", "완주문화관광재단 이OO 국장": "문화관광산업 총괄. 인구 증가 지역", "완주문화관광재단 이OO 주임": "축제 등록 실무", "칠곡군 이OO 주무관": "관광 마케팅 담당. 팸투어·온라인 이벤트 협업", "포천시 최OO 주무관": "관광 마케팅 담당. 반려동물 친화관광도시", "대구문화예술진흥원 박OO 대리": "국내외 SNS 10개 채널 운영 담당", "인천관광공사 고OO 대리": "자체 앱(인천e지)과 AI 여행비서 운영", "호텔신라 심OO 프로": "면세사업부 교육 담당. 대구석과 직접 협업 없음, 세션 A 참석. 이용자 관점 발언 포함", "티머니모빌리티 임OO 수석": "택시 결제·호출 사업. 공사 택시 데이터 사업 자문", "캐치테이블 정OO 실장": "식당 예약 플랫폼 대외협력. 미식 33선 업무협약", "타이드스퀘어 이OO 이사": "항공·숙박 예약 플랫폼. 숙박세일페스타 운영 총괄 경험", "아이나비시스템즈 금OO 그룹장": "내비게이션·지도, 스탬프 투어 서비스"};
function orgHTML(o){
  const i = ORG_INFO[o];
  return i ? `<span class="ow"><span class="on" tabindex="0">${hl(o)}</span><span class="tip tip-s">${esc(i)}</span></span>` : hl(o);
}
$('#legend').innerHTML = Object.entries(GROUPS).map(([g, o]) => `<div><span class="gb g${g}">${g}</span><b>${GNAME[g]}</b><span>${o.map(orgHTML).join(', ')}</span></div>`).join('');

$('#gseg').innerHTML = [['','전체'],['A','A'],['B','B'],['C','C']].map(([g,l]) => `<button data-g="${g}" class="${g===''?'on':''}">${l}</button>`).join('');
$('#gseg').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  st.g = b.dataset.g; st.org = ''; [...$('#gseg').children].forEach(x => x.classList.toggle('on', x === b)); fillOrg(); render(); };
function fillOrg(){
  const o = st.g ? GROUPS[st.g] : ORGS;
  $('#org').innerHTML = '<option value="">모든 참석자</option>' + o.map(x => `<option${x===st.org?' selected':''}>${esc(x)}</option>`).join('');
}
fillOrg();
$('#org').onchange = e => { st.org = e.target.value; render(); };
$('#q').oninput = e => { st.q = e.target.value.trim(); render(); };
$('#onlyReq').onchange = e => { st.onlyReq = e.target.checked; render(); };

function pass(r){
  if (st.g && r.group !== st.g) return false;
  if (st.org && r.org !== st.org) return false;
  if (st.onlyReq && !r.request) return false;
  if (st.q) { const q = st.q.toLowerCase(); if (![r.content, r.org, r.request, r.agree].join(' ').toLowerCase().includes(q)) return false; }
  return true;
}
function nav(){
  const n = s => s === REQ ? ROWS.filter(r => r.request && pass(r)).length : ROWS.filter(r => r.sections.includes(s) && pass(r)).length;
  $('#nav').innerHTML = SECS.map(s => `<button data-s="${esc(s)}" class="${s===st.sec?'on':''}">${esc(s)}<small>${n(s)}</small></button>`).join('')
    + `<span class="sep"></span><button data-s="${REQ}" class="reqtab ${st.sec===REQ?'on':''}">${REQ}<small>${n(REQ)}</small></button>` + (HAS_STRAT ? `<button data-s="${TASK}" class="tasktab ${st.sec===TASK?'on':''}">${TASK}</button>` : '');
}
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.s); };
function go(s){
  st.sec = s; history.replaceState(null, '', '#' + encodeURIComponent(s)); render();
  const top = $('nav.secs').offsetTop; if (scrollY > top) scrollTo({top});
}

function rows(list, sec){
  let prev = '';
  return list.map(r => {
    const cont = r.org === prev; prev = r.org;
    const rel = r.sections.filter(s => s !== sec);
    const note = [
      r.agree ? `<span><em>동조</em> ${hl(r.agree)}</span>` : '',
      rel.length ? `<span><em>관련</em> ${rel.map(s => `<a data-go="${esc(s)}">${esc(s)}</a>`).join(', ')}</span>` : '',
      r.request ? `<span class="rq">개선 요청 · ${hl(r.request)}</span>` : ''
    ].join('');
    return `<div class="tr${cont ? ' cont' : ''}"><div class="g">${cont ? '' : `<span class="gb g${r.group}">${r.group}</span>`}</div><div class="org">${cont ? '' : orgHTML(r.org)}</div>
      <div class="txt"><span class="sh" tabindex="0">${hl(r.short).replace(/==(.+?)==/g, '<q class="hl">$1</q>')}</span><span class="tip">${body(r.content)}</span></div><div class="note">${note}</div><div class="tc" title="세션 ${r.session} 전사본 기준 시각">${r.session} ${esc(tc(r.time))}</div></div>`;
  }).join('');
}
const TH = `<div class="tr th"><div>그룹</div><div>기관·발언자</div><div>주요내용</div><div>비고</div><div style="text-align:right">전사 위치</div></div>`;
function summary(sec){
  const s = D.summaries[sec] || [];
  if (!s.length) return '';
  const sh = (D.summaries_short || {})[sec] || [];
  const li = s.map((x, i) => {
    const t = sh[i] ? esc(sh[i]).replace(/==(.+?)==/g, '<q class="hl">$1</q>') : esc(x);
    return `<li><div class="txt"><span class="sh" tabindex="0">${t}</span><span class="tip">${esc(x)}</span></div></li>`;
  }).join('');
  return `<div class="summary"><h3>주요 의견</h3><ol>${li}</ol></div>`;
}
function render(){
  nav();
  let html = '', n = 0;
  if (st.sec === TASK && HAS_STRAT) { html += taskHTML(); n = D.strat.rows.length; }
  else if (st.sec === REQ) {
    html += `<div class="head"><h2>${REQ}</h2></div>`;
    for (const sec of SECS) {
      const rs = ROWS.filter(r => r.request && r.sections[0] === sec && pass(r)).sort(byOrg);
      if (!rs.length) continue; n += rs.length;
      let prev = '';
      html += `<h3 class="sub">${esc(sec)} <span>${rs.length}</span></h3><div class="tbl">` + rs.map(r => {
        const cont = r.org === prev; prev = r.org;
        return `<div class="rtr"><div class="g">${cont ? '' : `<span class="gb g${r.group}">${r.group}</span>`}</div><div class="org">${cont ? '' : orgHTML(r.org)}</div>
          <div><div class="ask">${hl(r.request)}</div><details><summary>관련 발언</summary><p>${body(r.content)}</p></details></div>
          <div class="tc" title="세션 ${r.session} 전사본 기준 시각">${r.session} ${esc(tc(r.time))}</div></div>`; }).join('') + `</div>`;
    }
  } else {
    const sel = ROWS.filter(r => r.sections.includes(st.sec) && pass(r)).sort(byOrg);
    n = sel.length;
    html += `<div class="head"><h2>${esc(st.sec)}</h2><span>${n}건</span></div>` + sumTask(st.sec);
    if (st.sec === SECS[0]) {
      const parts = SUBS.map((s, i) => [s, i, sel.filter(r => r.subtopic === s || (!SUBS.includes(r.subtopic) && i === 2))]).filter(p => p[2].length);
      html += `<div class="subnav">${parts.map(([s,i,rs]) => `<a href="#sub${i}">${esc(s)}<small>${rs.length}</small></a>`).join('')}</div>`;
      html += parts.map(([s,i,rs]) => `<h3 class="sub" id="sub${i}">${esc(s)} <span>${rs.length}</span></h3><div class="tbl">${TH}${rows(rs, st.sec)}</div>`).join('');
    } else if (n) {
      html += `<div class="tbl">${TH}${rows(sel, st.sec)}</div>`;
    }
  }
  if (!n) html += `<div class="empty">조건에 맞는 발언이 없습니다</div>`;
  $('#view').innerHTML = html;
  $('#count').textContent = `${n}건`;
}
document.addEventListener('click', e => {
  const sh = e.target.closest('.sh');
  document.querySelectorAll('.txt.open').forEach(t => { if (!sh || t !== sh.parentNode) t.classList.remove('open'); });
  if (sh && matchMedia('(hover: none)').matches) sh.parentNode.classList.toggle('open');
  const on = e.target.closest('.on');
  document.querySelectorAll('.ow.open').forEach(t => { if (!on || t !== on.parentNode) t.classList.remove('open'); });
  if (on && matchMedia('(hover: none)').matches) on.parentNode.classList.toggle('open');
  const b = e.target.closest('[data-go]'); if (b) { go(b.dataset.go); return; }
  const a = e.target.closest('.subnav a'); if (a) { e.preventDefault(); document.getElementById(a.getAttribute('href').slice(1)).scrollIntoView({behavior:'smooth'}); }
});
const h = decodeURIComponent(location.hash.slice(1));
const sp = new URLSearchParams(location.search).get('sec');
for (const c of [h, sp]) if (c && SECS.concat(REQ, HAS_STRAT ? [TASK] : []).includes(c)) st.sec = c;
render();
})();
</script>
</body>
</html>
